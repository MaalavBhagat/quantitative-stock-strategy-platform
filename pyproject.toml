[project]
name = "quantitative-stock-strategy-platform"
version = "0.1.0"
description = "Research platform testing whether a 'sell after a small rise, rebuy after a dip' strategy beats buy-and-hold after real costs (simulated, historical)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_research"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
