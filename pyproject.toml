[project]
name = "quantitative-stock-strategy-platform"
version = "0.1.0"
description = "Research platform testing whether a 'sell after a small rise, rebuy after a dip' strategy beats buy-and-hold after real costs (simulated, historical)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_research"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
crosscheck = [
    "yfinance>=1.7.0",
]
dashboard = [
    "altair>=6.3.0",
    "streamlit>=1.66.1",
    "vl-convert-python>=1.9.0.post1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
screenshots = [
    "playwright>=1.64.1",
]
