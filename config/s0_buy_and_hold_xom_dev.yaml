# Example run config (Phase 4). Money and rates are quoted strings so they are read exactly (no floats).
# S0 buy-and-hold on XOM, development period (allowed under D8).
run_name: s0_buy_and_hold_xom_dev
strategy: s0_buy_and_hold
ticker: XOM
start: 2010-01-04
end: 2016-12-30            # development period (EXPERIMENT_PLAN §4)
broker: stake              # stake | ibkr_fixed | commsec_standard
spread_level: normal       # tight | normal | wide  [ASSUMPTION levels]
share_mode: fractional     # fractional (MAIN) | whole (sensitivity)
initial_aud: "10000"
fx_source: rba             # RBA daily AUD/USD (DATA_SOURCES §9); "fixed" + usd_per_aud_start/end for tests
min_order_usd: "10"        # Stake minimum (BROKER_FEES §4)
reinvest_min_cash_usd: "100"  # reinvest dividends only once cash >= US$100 (Goggy 2026-10-21)
final_test_unlocked: false # D8 — only Goggy may change this
